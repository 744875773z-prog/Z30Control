name: Z30Control
options:
  bundleIdPrefix: com.nikonpro
targets:
  Z30Control:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Z30Control
        excludes:
          - "Info.plist"
          - "Resources/BuiltinLUTs"
      - path: Z30Control/Resources/BuiltinLUTs
        buildPhase: resources
    info:
      path: Z30Control/Info.plist
    scheme:
      build:
        targets:
          Z30Control: all
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nikonpro.z30control
      INFOPLIST_FILE: Z30Control/Info.plist
      CODE_SIGN_STYLE: Manual
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      DEVELOPMENT_TEAM: ""
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 1.0.0
      SWIFT_VERSION: "5.9"
      ENABLE_BITCODE: NO
      GENERATE_INFOPLIST_FILE: NO
