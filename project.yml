name: Z30Control
options:
  bundleIdPrefix: com.nikonpro
targets:
  Z30Control:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Z30Control
        excludes:
          - "Info.plist"
          - "Resources/BuiltinLUTs"
      - path: Z30Control/Resources/BuiltinLUTs
        buildPhase: resources
    # 注意：这里只写 path，不要加 properties——一旦写了 properties，
    # XcodeGen 就会改成生成一份只有默认值+properties 的 Info.plist，
    # 把源文件里的局域网/相册等权限描述全丢掉（v1.0.3 构建验证时发现的）。
    # UILaunchStoryboardName 源 plist 里本来就有，不用再写一遍。
    info:
      path: Z30Control/Info.plist
    scheme:
      build:
        targets:
          Z30Control: all
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nikonpro.z30control
      INFOPLIST_FILE: Z30Control/Info.plist
      CODE_SIGN_STYLE: Manual
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      DEVELOPMENT_TEAM: ""
      CURRENT_PROJECT_VERSION: 4
      MARKETING_VERSION: 1.0.3
      SWIFT_VERSION: "5.9"
      ENABLE_BITCODE: NO
      GENERATE_INFOPLIST_FILE: NO
