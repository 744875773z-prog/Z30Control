name: Z30Control
options:
  bundleIdPrefix: com.nikonpro
targets:
  Z30Control:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: Z30Control
        excludes:
          - "Info.plist"
          - "Resources/BuiltinLUTs"
      - path: Z30Control/Resources/BuiltinLUTs
        buildPhase: resources
    # 注意：这里不要写 info: 块——一旦写了，XcodeGen 每次 generate 都会
    # 用 properties+默认值重写 Z30Control/Info.plist，源文件里的权限描述
    # 和版本号全被丢掉（已实测两轮构建）。手写 Info.plist 是唯一真相来源，
    # 靠下面 settings 里的 INFOPLIST_FILE 引用它。
    scheme:
      build:
        targets:
          Z30Control: all
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nikonpro.z30control
      INFOPLIST_FILE: Z30Control/Info.plist
      CODE_SIGN_STYLE: Manual
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      DEVELOPMENT_TEAM: ""
      CURRENT_PROJECT_VERSION: 40
      MARKETING_VERSION: 1.0.39
      SWIFT_VERSION: "5.9"
      ENABLE_BITCODE: NO
      GENERATE_INFOPLIST_FILE: NO
