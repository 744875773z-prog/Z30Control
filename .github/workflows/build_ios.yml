name: 自动化编译 iOS IPA 安装包 (Build Z30Control IPA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: 编译与打包 iOS IPA
    runs-on: macos-latest

    steps:
      - name: 检出项目源代码
        uses: actions/checkout@v4

      - name: 检查 macOS 与 Xcode 开发环境
        run: |
          echo "=== 系统信息 ==="
          sw_vers
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: 安装与配置工程生成器 (XcodeGen)
        run: |
          echo "=== 正在准备 XcodeGen 环境 ==="
          brew install xcodegen || true
          xcodegen --version
          
          # 清理旧的空目录或残留
          rm -rf Z30Control.xcodeproj
          
          echo "=== 正在自动生成 Xcode 原生工程 ==="
          xcodegen generate
          ls -la Z30Control.xcodeproj

      - name: 使用 xcodebuild 编译 iOS Release App Bundle
        run: |
          echo "=== 开始编译 iOS 原生应用包 ==="
          xcodebuild build \
            -project Z30Control.xcodeproj \
            -scheme Z30Control \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: 组装与封装为标准 iOS .ipa 安装包
        run: |
          mkdir -p Payload
          # 寻找编译完成的 Release-iphoneos .app 目录
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          fi
          
          echo "定位到编译成功的 App: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          
          # 检查并注入 BuiltinLUTs 滤镜（如果未自动复制）
          if [ -d "Z30Control/Resources/BuiltinLUTs" ] && [ ! -d "Payload/Z30Control.app/BuiltinLUTs" ]; then
            mkdir -p "Payload/Z30Control.app/BuiltinLUTs"
            cp -r Z30Control/Resources/BuiltinLUTs/* "Payload/Z30Control.app/BuiltinLUTs/"
          fi
          
          # 生成标准 IPA zip 压缩包
          zip -r -q Z30Control.ipa Payload
          echo "=========================================="
          echo "🎉 恭喜！已成功生成 iOS .ipa 安装包！"
          ls -lh Z30Control.ipa
          echo "=========================================="

      - name: 上传构建产物 (提供网页一键下载)
        uses: actions/upload-artifact@v4
        with:
          name: Z30Control-iOS-IPA
          path: Z30Control.ipa
          retention-days: 14
